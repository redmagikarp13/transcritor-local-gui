name: Build Windows Executable

on:
  push:
    branches: [ "feature/universal-gui", "main" ]
  pull_request:
    branches: [ "feature/universal-gui", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/requirements.txt
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "SimpleTranscribe" --add-data "tools;tools/" --add-data "gui;gui/" "gui/main.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleTranscribe-Windows
        path: dist/SimpleTranscribe/
