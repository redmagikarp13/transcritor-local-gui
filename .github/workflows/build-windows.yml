name: Build Windows Executable

on:
  push:
    branches: [ "feature/universal-gui", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "feature/universal-gui", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/requirements.txt
        pip install pyinstaller customtkinter

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SimpleTranscribe" --hidden-import=faster_whisper --hidden-import=ctranslate2 --hidden-import=tokenizers --collect-data faster_whisper --add-data "tools;tools/" --add-data "gui;gui/" "gui/main.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleTranscribe-Windows
        path: dist/SimpleTranscribe.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/SimpleTranscribe.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
