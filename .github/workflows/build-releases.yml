name: Build Releases

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/transcritor/core/requirements.txt
        pip install -r gui_requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg (Windows)
      if: runner.os == 'Windows'
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
        $ffmpegDir = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
        Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" ffmpeg.exe
        Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

    - name: Download FFmpeg (Mac)
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg
        cp $(which ffmpeg) ffmpeg

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "TranscritorLocal" --hidden-import=faster_whisper --hidden-import=ctranslate2 --hidden-import=tokenizers --hidden-import=transcritor.gui.transcribe_runner --collect-data faster_whisper --collect-data customtkinter --add-data "src/transcritor/core;transcritor/core/" --add-data "src/transcritor/gui;transcritor/gui/" --add-binary "ffmpeg.exe;." "src/transcritor/gui/main.py"

    - name: Build with PyInstaller (Mac)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "TranscritorLocal-Mac" --hidden-import=faster_whisper --hidden-import=ctranslate2 --hidden-import=tokenizers --hidden-import=transcritor.gui.transcribe_runner --collect-data faster_whisper --collect-data customtkinter --add-data "src/transcritor/core:transcritor/core/" --add-data "src/transcritor/gui:transcritor/gui/" --add-binary "ffmpeg:." "src/transcritor/gui/main.py"
        cd dist
        zip -r TranscritorLocal-Mac.zip "TranscritorLocal-Mac.app"

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: TranscritorLocal-Windows
        path: dist/TranscritorLocal.exe

    - name: Upload artifact (Mac)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: TranscritorLocal-Mac
        path: dist/TranscritorLocal-Mac.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/TranscritorLocal.exe
          dist/TranscritorLocal-Mac.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
